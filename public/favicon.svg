<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9066"/>
      <stop offset="1" stop-color="#ff7849"/>
    </linearGradient>
  </defs>
  <!-- pencil rotated 45°, pointing to bottom-left -->
  <g transform="rotate(45 32 32)">
    <!-- eraser -->
    <rect x="26" y="8" width="12" height="7" rx="2" fill="#d49a82"/>
    <!-- ferrule (metal band) -->
    <rect x="26" y="14" width="12" height="4" fill="#8b91a7"/>
    <!-- body -->
    <rect x="26" y="18" width="12" height="28" fill="url(#copper)"/>
    <!-- wooden tip -->
    <path d="M26 46 L38 46 L32 56 Z" fill="#c4a882"/>
    <!-- graphite point -->
    <path d="M30 52 L34 52 L32 56 Z" fill="#161922"/>
  </g>
</svg>
